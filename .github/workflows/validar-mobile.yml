name: Validar navegação e leitura mobile

on:
  push:
    paths:
      - 'aulas/**'
      - 'assets/**'
      - 'scripts/verificar-mobile.mjs'
      - 'scripts/verificar-sincronizacao.mjs'
      - 'scripts/verificar-adaptacao.mjs'
      - 'scripts/verificar-lido-final.mjs'
      - 'scripts/verificar-padrao-aulas.mjs'
      - 'scripts/capturar-engenharia.mjs'
      - 'scripts/auditar-conteudo-aulas.mjs'
      - 'dados/concursos.json'
      - 'dados/questoes.json'
      - 'dados/questoes-adaptadas.json'
      - 'dados/questoes-reais.json'
      - 'dados/questoes-casan-aocp.json'
      - 'dados/fontes-aocp-joinville-2025.json'
      - 'scripts/verificar-curadoria-aocp.mjs'
      - 'scripts/verificar-cobertura-casan.mjs'
      - 'scripts/verificar-ima-ciclo.mjs'
      - 'dados/cobertura-casan.json'
      - 'dados/cobertura-ima.json'
      - 'scripts/verificar-cobrado-prova.mjs'
      - 'scripts/verificar-leitura-guiada.mjs'
      - 'scripts/verificar-avanco-lido.mjs'
      - 'scripts/verificar-pratica-automatica.mjs'
      - 'scripts/verificar-caderno-pdf.mjs'
      - 'cadernos/**'
      - 'supabase/schema.sql'
      - 'conta.html'
      - '.github/workflows/validar-mobile.yml'
      - 'index.html'
      - 'aulas.html'
      - 'planejamento.html'
      - 'progresso.html'
      - 'revisoes.html'
  pull_request:
    paths:
      - 'aulas/**'
      - 'assets/**'
      - 'scripts/verificar-mobile.mjs'
      - 'scripts/verificar-sincronizacao.mjs'
      - 'scripts/verificar-adaptacao.mjs'
      - 'scripts/verificar-lido-final.mjs'
      - 'scripts/verificar-padrao-aulas.mjs'
      - 'scripts/capturar-engenharia.mjs'
      - 'scripts/auditar-conteudo-aulas.mjs'
      - 'dados/concursos.json'
      - 'dados/questoes.json'
      - 'dados/questoes-adaptadas.json'
      - 'dados/questoes-reais.json'
      - 'dados/questoes-casan-aocp.json'
      - 'dados/fontes-aocp-joinville-2025.json'
      - 'scripts/verificar-curadoria-aocp.mjs'
      - 'scripts/verificar-cobertura-casan.mjs'
      - 'scripts/verificar-ima-ciclo.mjs'
      - 'dados/cobertura-casan.json'
      - 'dados/cobertura-ima.json'
      - 'scripts/verificar-cobrado-prova.mjs'
      - 'scripts/verificar-leitura-guiada.mjs'
      - 'scripts/verificar-avanco-lido.mjs'
      - 'scripts/verificar-pratica-automatica.mjs'
      - 'scripts/verificar-caderno-pdf.mjs'
      - 'cadernos/**'
      - 'supabase/schema.sql'
      - 'conta.html'
      - '.github/workflows/validar-mobile.yml'
      - 'index.html'
      - 'aulas.html'
      - 'planejamento.html'
      - 'progresso.html'
      - 'revisoes.html'

jobs:
  smoke-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependência de navegador de teste
        run: npm install --no-save --ignore-scripts playwright-core@1.55.1
      - name: Validar sintaxe da sincronização
        run: node --check assets/new-lesson.js && node --check assets/cobranca-dados.js && node --check assets/cobranca-na-pratica.js && node --check assets/sync.js && node --check assets/adaptive.js && node --check assets/quiz.js && node --check assets/practice-auto.js && node --check scripts/verificar-sincronizacao.mjs && node --check scripts/verificar-adaptacao.mjs && node --check scripts/verificar-pratica-automatica.mjs && node --check scripts/verificar-avanco-lido.mjs
      - name: Testar 320, 390 e 430 px
        run: node scripts/verificar-mobile.mjs
      - name: Testar índice recolhível e navegação móvel das nove aulas
        run: timeout 100s node scripts/verificar-leitura-guiada.mjs
      - name: Verificar exemplos de provas, origens e respostas nas nove aulas
        run: timeout 125s node scripts/verificar-cobrado-prova.mjs
      - name: Verificar Lido ao final e fórmulas PA/PG em quadro
        run: timeout 75s node scripts/verificar-lido-final.mjs
      - name: Validar padrão único das nove aulas
        run: timeout 100s node scripts/verificar-padrao-aulas.mjs
      - name: Auditar subseções das nove aulas
        run: timeout 75s node scripts/auditar-conteudo-aulas.mjs
      - name: Capturar renderização de Engenharia em 320, 390 e 430 px
        run: timeout 60s node scripts/capturar-engenharia.mjs
      - name: Disponibilizar capturas de Engenharia para auditoria visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engenharia-visual-mobile
          path: artifacts/engenharia/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Testar sincronização simulada entre dois aparelhos
        run: timeout 90s node scripts/verificar-sincronizacao.mjs

  smoke-adaptive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de teste
        run: npm install --no-save --ignore-scripts playwright-core@1.55.1
      - name: Validar sintaxe do motor adaptativo
        run: node --check assets/ima-study-cycle.js && node --check assets/cobertura-ima.js && node --check assets/practice-auto.js && node --check assets/adaptive.js && node --check scripts/verificar-adaptacao.mjs
      - name: Validar caderno PDF de 13 questões AOCP selecionadas
        run: node scripts/verificar-caderno-pdf.mjs
      - name: Testar matriz IMA, simulado FURB e diagnóstico privado nas telas mobile
        run: timeout 125s node scripts/verificar-ima-ciclo.mjs
      - name: Verificar cobertura oficial CASAN 404 e links para as aulas
        run: node scripts/verificar-cobertura-casan.mjs
      - name: Verificar 50 questões AOCP e 25 subseções aprimoradas
        run: node scripts/verificar-curadoria-aocp.mjs
      - name: Testar recomendações e atualização por hora
        run: timeout 90s node scripts/verificar-adaptacao.mjs
      - name: Testar sábado e revisões automáticas sem registro manual
        run: timeout 100s node scripts/verificar-pratica-automatica.mjs
      - name: Testar Próxima e marcação Lido nas nove aulas
        run: timeout 100s node scripts/verificar-avanco-lido.mjs
